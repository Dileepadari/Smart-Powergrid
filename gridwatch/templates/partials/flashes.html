{% from "partials/icons.html" import icon %}
{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    <div class="flashes">
      {% for category, message in messages %}
        <div class="flash flash--{{ category }}" role="status">
          {{ icon('check-circle' if category == 'success' else 'alert-circle') }}
          <p>{{ message }}</p>
          <button type="button" aria-label="Dismiss" data-dismiss>{{ icon('close') }}</button>
        </div>
      {% endfor %}
    </div>
  {% endif %}
{% endwith %}
