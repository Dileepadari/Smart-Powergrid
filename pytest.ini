[pytest]
# The repo root on sys.path, so `pytest` works the same as `python -m pytest`.
# Without this only the latter works, because `python -m` puts the working
# directory on sys.path and a bare `pytest` does not: `from gridwatch import
# create_app` in tests/conftest.py then fails with ModuleNotFoundError.
pythonpath = .
testpaths = tests
